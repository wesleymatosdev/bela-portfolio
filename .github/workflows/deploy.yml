# Deploys the site to GitHub Pages and keeps index.html's project cards in
# sync with www/content/projects.json (edited via the CMS at /admin).
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate project cards from projects.json
        run: python tools/build_projects.py
      - name: Commit regenerated cards (repo self-heal, no retrigger)
        run: |
          git config user.name "bela-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add www/index.html www/content/projects.json
            git commit -m "chore: regenerate project cards [skip ci]"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./www"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
